name: Docker Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  # PRs trigger a build-only pass (push: false below) so we catch Docker-
  # layering regressions pre-merge rather than on main after the fact.
  # See PR #44 — Slice A's postinstall hook broke Stage 1 only under Docker
  # and was invisible to dev-box + "npm run build" smoke checks.
  pull_request:
    branches: [main]

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Registry login is only needed when we're about to push. Skipping
      # on pull_request keeps PR builds from touching ghcr.io credentials
      # at all.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # push only on non-PR events — PRs get a build-only verification pass.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
